name: Rilis Aplikasi dengan Installer

on:
  push:
    tags:
      - 'v*.*.*' # Trigger setiap kali ada tag baru dengan format vX.Y.Z

jobs:
  build-and-release:
    runs-on: windows-latest # Tetap pakai Windows runner

    steps:
    - name: Checkout kode
      uses: actions/checkout@v4

    - name: Siapkan Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependensi dan Nuitka
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka

    - name: Download dan Ekstrak FFmpeg Binaries
      run: |
        $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-git-full.7z"
        $ffmpegZip = "ffmpeg-full.7z"
        $ffmpegDir = "ffmpeg_bins"

        choco install 7zip --confirm

        Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZip

        mkdir $ffmpegDir

        7z x $ffmpegZip -o"$ffmpegDir" -aoa

        $binFolder = Get-ChildItem -Path $ffmpegDir -Directory | Where-Object {$_.Name -like "ffmpeg-*-gpl" -or $_.Name -like "ffmpeg-*-full"} | Select-Object -ExpandProperty FullName
        if ($binFolder) {
          Move-Item -Path "$binFolder\bin\ffmpeg.exe" -Destination "$ffmpegDir\ffmpeg.exe"
          Move-Item -Path "$binFolder\bin\ffprobe.exe" -Destination "$ffmpegDir\ffprobe.exe"
        } else {
          Write-Error "Folder bin FFmpeg tidak ditemukan setelah ekstraksi."
          exit 1
        }

    - name: Download dan Ekstrak aria2c Binaries
      run: |
        # URL untuk aria2c static build (dari GitHub q3aql/aria2-static-builds)
        $aria2cUrl = "https://github.com/q3aql/aria2-static-builds/releases/download/v1.36.0/aria2-1.36.0-win-64bit-build2.7z"
        $aria2cZip = "aria2c-win-64bit.7z"
        $aria2cDir = "aria2c_bins"

        # 7-Zip sudah terinstal dari step sebelumnya

        Invoke-WebRequest -Uri $aria2cUrl -OutFile $aria2cZip

        mkdir $aria2cDir

        # Ekstrak aria2c
        7z x $aria2cZip -o"$aria2cDir" -aoa
        # Pindahkan aria2c.exe ke root folder biner aria2c
        Move-Item -Path "$aria2cDir\aria2-1.36.0-win-64bit-build2\aria2c.exe" -Destination "$aria2cDir\aria2c.exe"


    - name: Compile aplikasi dengan Nuitka
      run: |
        # Command Nuitka lo, ditambahi --include-extra-binaries untuk FFmpeg dan aria2c
        python -m nuitka --standalone --windows-disable-console --enable-plugin=pyside6 `
          --include-qt-plugins=multimedia,platforms `
          --nofollow-import-to=yt_dlp.extractor.lazy_extractors `
          --output-dir=build --output-filename=MRD-YouTube-Downloader `
          --windows-icon-from-ico=youtube_downloader_icon.ico --remove-output main.py `
          --include-extra-binaries=ffmpeg_bins\ffmpeg.exe=ffmpeg.exe `
          --include-extra-binaries=ffmpeg_bins\ffprobe.exe=ffprobe.exe `
          --include-extra-binaries=aria2c_bins\aria2c.exe=aria2c.exe # Penambahan aria2c.exe

    - name: Install Inno Setup
      run: |
        choco install innosetup --confirm

    - name: Siapkan Script Inno Setup dan Build Installer
      id: build_installer
      run: |
        mkdir installer_output

        $tagName = "${{ github.ref_name }}"
        $outputBaseName = "mrd-YouTube-downloader-$tagName"

        (Get-Content installer.iss) `
          -replace '#define MyAppVersion "1.5.0"', "#define MyAppVersion `"$tagName`"" `
          -replace 'OutputDir=D:\\', "OutputDir=`".\\installer_output`"" `
          -replace 'OutputBaseFilename=mrd-YouTube-downloader1.5.0', "OutputBaseFilename=`"$outputBaseName`"" `
          -replace 'Source: "C:\\Users\\ridho\\mrd-YouTube-downloader\\build\\main.dist\\{#MyAppExeName}"', "Source: `".\\build\\{#MyAppExeName}`"" `
          | Set-Content installer_dynamic.iss

        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer_dynamic.iss"

        echo "INSTALLER_FILENAME=$outputBaseName.exe" >> $GITHUB_OUTPUT

    - name: Baca Changelog dari file
      id: get_changelog
      run: |
        CHANGELOG_BODY=$(python -c "
import re
import os
tag = os.environ['GITHUB_REF_NAME']
with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
    content = f.read()
match = re.search(r'## ' + re.escape(tag) + r'\s*\n(.*?)(?=\n## v\d|\Z)', content, re.DOTALL | re.IGNORECASE)
if match:
    print(match.group(1).strip())
else:
    print(f'Tidak ada catatan perubahan untuk {tag}.')
        ")
        echo "CHANGELOG_BODY<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG_BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Buat Rilis di GitHub & Upload Aset
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: installer_output/${{ steps.build_installer.outputs.INSTALLER_FILENAME }}
        prerelease: false
        name: Rilis ${{ github.ref_name }}
        body: ${{ steps.get_changelog.outputs.CHANGELOG_BODY }}
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
