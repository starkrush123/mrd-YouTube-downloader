name: Rilis Aplikasi dengan Installer

on:
  push:
    tags:
      - 'v*.*.*' # Trigger setiap kali ada tag baru dengan format vX.Y.Z

jobs:
  build-and-release:
    runs-on: windows-latest # Tetap pakai Windows runner

    steps:
    - name: Checkout kode
      uses: actions/checkout@v4

    - name: Siapkan Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependensi dan Nuitka
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka

    - name: Compile aplikasi dengan Nuitka
      run: |
        # Command Nuitka yang lo kasih
        python -m nuitka --standalone --windows-disable-console --enable-plugin=pyside6 --include-qt-plugins=multimedia,platforms --nofollow-import-to=yt_dlp.extractor.lazy_extractors --output-dir=build --output-filename=MRD-YouTube-Downloader --windows-icon-from-ico=youtube_downloader_icon.ico --remove-output main.py

    - name: Install Inno Setup
      run: |
        choco install innosetup --confirm # Pake Chocolatey buat install Inno Setup

    - name: Siapkan Script Inno Setup dan Build Installer
      id: build_installer
      run: |
        # Buat folder output installer
        mkdir installer_output

        # Buat script Inno Setup dinamis dari template lo
        # Kita akan ganti path hardcoded dan versi aplikasinya
        # Asumsi script Inno Setup lo disimpan di root repo dengan nama 'installer.iss'
        $tagName = "${{ github.ref_name }}" # Ambil nama tag (misal 'v1.5.0')
        $outputBaseName = "mrd-YouTube-downloader-$tagName"

        # Ganti variabel di script Inno Setup biar dinamis
        (Get-Content installer.iss) `
          -replace '#define MyAppVersion "1.5.0"', "#define MyAppVersion `"$tagName`"" `
          -replace 'OutputDir=D:\\', "OutputDir=`".\\installer_output`"" `
          -replace 'OutputBaseFilename=mrd-YouTube-downloader1.5.0', "OutputBaseFilename=`"$outputBaseName`"" `
          -replace 'Source: "C:\\Users\\ridho\\mrd-YouTube-downloader\\build\\main.dist\\{#MyAppExeName}"', "Source: `".\\build\\{#MyAppExeName}`"" `
          | Set-Content installer_dynamic.iss

        # Jalanin Inno Setup Compiler
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer_dynamic.iss"

        # Set output filename buat step selanjutnya
        echo "INSTALLER_FILENAME=$outputBaseName.exe" >> $GITHUB_OUTPUT


    - name: Baca Changelog dari file
      id: get_changelog
      run: |
        # Script Python ini akan membaca bagian changelog yang sesuai dengan versi tag saat ini dari CHANGELOG.md
        CHANGELOG_BODY=$(python -c "
import re
import os
tag = os.environ['GITHUB_REF_NAME']
with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
    content = f.read()
match = re.search(r'## ' + re.escape(tag) + r'\s*\n(.*?)(?=\n## v\d|\Z)', content, re.DOTALL | re.IGNORECASE)
if match:
    print(match.group(1).strip())
else:
    print(f'Tidak ada catatan perubahan untuk {tag}.')
        ")
        echo "CHANGELOG_BODY<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG_BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Buat Rilis di GitHub & Upload Aset
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: installer_output/${{ steps.build_installer.outputs.INSTALLER_FILENAME }} # Upload installer yang udah jadi
        prerelease: false
        name: Rilis ${{ github.ref_name }}
        body: ${{ steps.get_changelog.outputs.CHANGELOG_BODY }}
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}